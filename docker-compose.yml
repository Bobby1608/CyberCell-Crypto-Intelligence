services:
  # Neo4j Graph Database Service
  neo4j:
    image: neo4j:5.18.0-community
    container_name: forensics_neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    ports:
      - "7474:7474" # HTTP Browser Console
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || cypher-shell -u neo4j -p $${NEO4J_PASSWORD} 'RETURN 1;' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Redis In-Memory Cache Service
  redis:
    image: redis:7.2-alpine
    container_name: forensics_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # FastAPI Blockchain Forensics Backend Worker & API Server
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: forensics_backend
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SEPOLIA_WS_URL=${SEPOLIA_WS_URL}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY}
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend Dashboard & Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forensics_frontend
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neo4j_data:
    driver: local
